<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="t d">
<title id="t">Performance car illustration</title><desc id="d">Original vector illustration of a dark modern sports car, with cool blue highlights and subtle studio reflections.</desc>
<defs>
 <linearGradient id="body" x1=".1" y1="0" x2=".85" y2="1"><stop stop-color="#647b8e"/><stop offset=".18" stop-color="#263b50"/><stop offset=".52" stop-color="#101c2a"/><stop offset=".8" stop-color="#27394b"/><stop offset="1" stop-color="#070f19"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#78d9ef" stop-opacity=".62"/><stop offset=".28" stop-color="#193b54"/><stop offset="1" stop-color="#091521"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#147fa4"/><stop offset=".5" stop-color="#66e6ff"/><stop offset="1" stop-color="#1587b0"/></linearGradient>
 <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1c7894" stop-opacity=".5"/><stop offset="1" stop-color="#09121e" stop-opacity="0"/></linearGradient>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
 <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
